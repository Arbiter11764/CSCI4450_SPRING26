<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDN Playable Chess</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>

<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function ChessApp() {
    const [game, setGame] = useState(new Chess());
    const [selectedSquare, setSelectedSquare] = useState(null);
    const [optionSquares, setOptionSquares] = useState([]);
    const [history, setHistory] = useState([]);
    const [musicOn, setMusicOn] = useState(false);
    const audioRef = useRef(null);

    // ♟ Load saved game on page load
    useEffect(() => {
        const savedPGN = localStorage.getItem("chessGame");
        if (savedPGN) {
            const newGame = new Chess();
            newGame.load_pgn(savedPGN);
            setGame(newGame);
            setHistory(newGame.history());
        }
    }, []);

    // 💾 Save game whenever history updates
    useEffect(() => {
        localStorage.setItem("chessGame", game.pgn());
    }, [history]);

    const pieceSymbols = {
        p:'♟', r:'♜', n:'♞', b:'♝', q:'♛', k:'♚',
        P:'♙', R:'♖', N:'♘', B:'♗', Q:'♕', K:'♔'
    };

    const board = game.board();

    function getSquareLabel(i, j) {
        return String.fromCharCode(97 + j) + (8 - i);
    }

    function handleSquareClick(square) {

        if (selectedSquare) {
            const newGame = new Chess(game.fen());
            const move = newGame.move({
                from: selectedSquare,
                to: square,
                promotion: 'q'
            });

            if (move) {
                setGame(newGame);
                setHistory(newGame.history());
            }

            setSelectedSquare(null);
            setOptionSquares([]);
            return;
        }

        const piece = game.get(square);
        if (piece && piece.color === game.turn()) {
            setSelectedSquare(square);
            const moves = game.moves({ square, verbose: true });
            setOptionSquares(moves.map(m => m.to));
        } else {
            setSelectedSquare(null);
            setOptionSquares([]);
        }
    }

    // 🔁 Undo move
    function undoMove() {
        const newGame = new Chess(game.fen());
        const undone = newGame.undo();
        if (!undone) return;

        setGame(newGame);
        setHistory(newGame.history());
    }

    function resetGame() {
        const newGame = new Chess();
        setGame(newGame);
        setHistory([]);
        localStorage.removeItem("chessGame");
    }

    function toggleMusic() {
        if (!audioRef.current) return;
        if (musicOn) {
            audioRef.current.pause();
        } else {
            audioRef.current.play();
        }
        setMusicOn(!musicOn);
    }

    const status = () => {
        if (game.in_checkmate()) return `Checkmate! ${game.turn() === 'w' ? 'Black' : 'White'} wins.`;
        if (game.in_draw()) return "Draw!";
        return `${game.turn() === 'w' ? "White's" : "Black's"} Turn`;
    };

    return (
        <div className="flex flex-col items-center gap-6">

            <h1 className="text-3xl font-bold text-yellow-500">React CDN Chess</h1>

            <p className={`text-lg font-medium ${game.in_check() ? 'text-red-500 animate-pulse' : 'text-gray-300'}`}>
                {status()}
            </p>

            {/* 🎵 Background Music */}
            <audio
                ref={audioRef}
                loop
                src="https://www.bensound.com/bensound-music/bensound-slowmotion.mp3"
            />

            <div className="grid grid-cols-8 border-4 border-gray-700 shadow-2xl">
                {board.map((row, i) =>
                    row.map((square, j) => {
                        const squareLabel = getSquareLabel(i, j);
                        const isDark = (i + j) % 2 === 1;
                        const isSelected = selectedSquare === squareLabel;
                        const isOption = optionSquares.includes(squareLabel);

                        return (
                            <div
                                key={squareLabel}
                                onClick={() => handleSquareClick(squareLabel)}
                                className={`w-12 h-12 md:w-16 md:h-16 flex items-center justify-center text-4xl cursor-pointer relative
                                    ${isDark ? 'bg-slate-700' : 'bg-slate-400'}
                                    ${isSelected ? 'bg-yellow-200/50' : ''}
                                `}
                            >
                                {isOption && (
                                    <div className="absolute w-4 h-4 bg-black/30 rounded-full"></div>
                                )}

                                <span className={`select-none ${square?.color === 'w' ? 'text-white drop-shadow-md' : 'text-black'}`}>
                                    {square ? pieceSymbols[square.color === 'w' ? square.type.toUpperCase() : square.type] : ''}
                                </span>
                            </div>
                        );
                    })
                )}
            </div>

            <div className="flex gap-4">
                <button onClick={undoMove} className="bg-blue-600 px-4 py-2 rounded">
                    Undo
                </button>

                <button onClick={resetGame} className="bg-red-600 px-4 py-2 rounded">
                    New Game
                </button>

                <button onClick={toggleMusic} className="bg-green-600 px-4 py-2 rounded">
                    {musicOn ? "Pause Music" : "Play Music"}
                </button>
            </div>

            <div className="mt-4 text-sm text-gray-400 max-w-md text-center">
                <strong>Move History:</strong>
                <div className="mt-2 break-words">
                    {history.join(", ")}
                </div>
            </div>

        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ChessApp />);
</script>
</body>
</html>
